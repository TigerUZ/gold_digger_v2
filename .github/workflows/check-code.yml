name: Python Code Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check Style and Syntax (Linter)
        run: ruff check --exclude ./migrations .

      - name: Run tests
        env:
          DB_USER: test
          DB_PASSWORD: test
          DB_PORT: "5432"
          DB_HOST: localhost
          DB_DATABASE: test_db
          REFERRAL_GOLD_QTY: "500"
          TOKEN: "0000000000:TEST_TOKEN_FOR_CI"
          APP_URL: https://example.com
          BOT_USERNAME: gold_digger_test_bot
        run: pytest -q
